server {
    listen 443 ssl;
    server_name priceflex.algovent.com apps.algovent.com;

    ssl_certificate /etc/letsencrypt/live/priceflex.algovent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/priceflex.algovent.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Cloudflare Flexible SSL connects to origin on port 80.
# Do NOT redirect HTTP -> HTTPS here or you get ERR_TOO_MANY_REDIRECTS.
server {
    listen 80;
    server_name priceflex.algovent.com apps.algovent.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}